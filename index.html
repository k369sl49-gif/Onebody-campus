<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONEBODY — 캠퍼스 커뮤니티</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg-paper: #F7F6F2;
      --bg-card: #FFFFFF;
      --bg-card-sub: #EFEDE6;
      --text-main: #1C1917;
      --text-sub: #57534E;
      --text-muted: #78716C;
      --border-line: #D6D3D1;
      --border-light: #E7E5E4;
      --accent-dark: #1C1917;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(247, 246, 242, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-line);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background-color: var(--text-main);
      border-radius: 50%;
      display: inline-block;
    }
